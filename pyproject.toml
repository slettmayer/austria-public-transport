# Tool configuration only — nothing builds or publishes this project. The
# shipped version is the one in custom_components/austria_public_transport/
# manifest.json, which is what `release.yml` tags from; `version` below is inert
# and deliberately not kept in sync.
[project]
name = "austria-public-transport"
version = "0.4.0"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: tests that hit real external APIs (deselect with '-m not integration')",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
]
