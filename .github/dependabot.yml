version: 2
# The two ecosystems run on different days. Their PRs auto-merge, and the
# ruleset requires a branch to be up to date with main -- which auto-merge
# never does for you -- so a same-day pair would strand the second PR.
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "thursday"
    groups:
      github-actions:
        patterns:
          - "*"
  # Watches requirements_lint.txt. Without this the ruff pin is never bumped,
  # and pinning without a bumper is how a linter silently goes stale.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      python-lint-deps:
        patterns:
          - "*"
